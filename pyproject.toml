[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llamaproxy"
version = "1.0.0"
description = "Integrates Codex with llama.cpp, enabling the use of LLMs in a local environment."
readme = "README.es.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "codex-llamacpp-proxy contributors" },
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[project.scripts]
codex-llamacpp-proxy = "codex_llamacpp_proxy.server:main"

[tool.pytest.ini_options]
addopts = "--cov=codex_llamacpp_proxy"
pythonpath = ["src"]
testpaths = ["tests"]
