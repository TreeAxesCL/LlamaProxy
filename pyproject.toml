[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llamaproxy"
version = "1.0.0"
description = "A proxy for integrate OpenAI Codex with llama.cpp for use in local LLMs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "LlamaProxy and codex-llamacpp-proxy contributors" }
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[project.scripts]
llamaproxy = "llamaproxy.server:main"

[tool.pytest.ini_options]
addopts = "--cov=llamaproxy"
pythonpath = ["src"]
testpaths = ["tests"]